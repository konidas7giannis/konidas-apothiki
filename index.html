<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Αποθήκη">
<title>Konidas Αποθήκη</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<style>
:root{
  /* layout: one task per screen — big tiles, fixed route bar while scanning, one confirm button at the bottom */
  --navy:#041E42; --navy2:#123766; --gold:#f5a623;
  --bg:#eef1f6; --card:#ffffff; --ink:#0f1b2d; --muted:#5b6b82; --line:#d6dde8;
  --ok:#1d7f46; --okbg:#e2f3e9; --warn:#995a00; --warnbg:#fff0d6; --bad:#b71c1c; --badbg:#fde5e5;
  --fd:"Montserrat",system-ui,-apple-system,sans-serif;
  --fb:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--fb);-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
.brand{display:flex;flex-direction:column;line-height:1}
.brand b{font:800 19px var(--fd);letter-spacing:.06em}
.brand small{font:700 9px var(--fd);color:var(--gold);letter-spacing:.18em;margin-top:3px}
.ht{font:600 15px var(--fd);flex:1;opacity:.9}
.who{background:var(--navy2);border:0;color:#fff;border-radius:999px;padding:7px 12px;font-weight:600;font-size:14px}
main{padding:16px;display:flex;flex-direction:column;gap:14px;flex:1}
h1{font:800 24px var(--fd);margin:4px 0 0;color:var(--navy);text-wrap:balance}
h2{font:700 17px var(--fd);margin:0}
.muted{color:var(--muted);font-size:14px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:#fff;border:2px solid var(--line);border-radius:16px;padding:16px 14px;min-height:84px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:2px;text-align:left}
.tile b{font:700 18px var(--fd);color:var(--navy)}
.tile small{color:var(--muted);font-size:13px}
.tile.cust{background:#f3f7ee;border-color:#b8d9a8}
.tile.sup{background:#f6f3ea;border-color:#e2cf9e}
.tile[disabled]{opacity:.35}
.big{display:grid;gap:12px}
.bigbtn{border:0;border-radius:18px;padding:20px;display:flex;align-items:center;gap:16px;text-align:left;min-height:96px;color:#fff;background:var(--navy)}
.bigbtn svg{flex:none;width:40px;height:40px}
.bigbtn b{display:block;font:800 21px var(--fd)}
.bigbtn span{font-size:14px;opacity:.85}
.bigbtn.gold{background:var(--gold);color:var(--navy)}
.bigbtn.light{background:#fff;color:var(--navy);border:2px solid var(--line)}
.lastroute{background:#fff;border:2px dashed var(--gold);border-radius:14px;padding:12px 14px;text-align:left;font-weight:600}
.lastroute small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.btn{border:0;border-radius:14px;padding:14px 16px;font-weight:700;font-size:17px;min-height:56px;width:100%}
.btn-ok{background:var(--ok);color:#fff}
.btn-navy{background:var(--navy);color:#fff}
.btn-ghost{background:#fff;border:2px solid var(--line)}
.btn-sm{min-height:40px;font-size:14px;padding:8px 12px;width:auto;border-radius:10px}
.btn-bad{background:#fff;border:2px solid var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.4}
.back{background:none;border:0;color:var(--navy);font-weight:700;padding:4px 0;align-self:flex-start;font-size:15px}
.route{background:var(--navy);color:#fff;border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;font:700 17px var(--fd)}
.route .ar{color:var(--gold)}
.camwrap{position:relative;background:#000;border-radius:16px;overflow:hidden;aspect-ratio:4/3}
.camwrap video{width:100%;height:100%;object-fit:cover;display:block}
.camwrap .aim{position:absolute;left:12%;right:12%;top:38%;bottom:38%;border:3px solid rgba(245,166,35,.9);border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.25)}
.camwrap .flash{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s}
.flash.g{background:rgba(29,127,70,.55);opacity:1}
.flash.r{background:rgba(183,28,28,.55);opacity:1}
.camoff{background:#fff;border:2px dashed var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px;align-items:stretch;text-align:center}
.msg{border-radius:12px;padding:12px 14px;font-weight:600;font-size:15px}
.m-ok{background:var(--okbg);color:var(--ok)}
.m-bad{background:var(--badbg);color:var(--bad)}
.m-warn{background:var(--warnbg);color:var(--warn)}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:700;font-size:15px}
.item .t small{color:var(--muted);font-size:12px}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font:700 18px var(--fd)}
.qty span{font:800 20px var(--fd);min-width:22px;text-align:center;font-variant-numeric:tabular-nums}
.rm{border:0;background:var(--badbg);color:var(--bad);width:38px;height:38px;border-radius:10px;font-size:18px;font-weight:700}
.footer{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:16px 0 18px;display:flex;flex-direction:column;gap:8px}
.sentence{background:#fff;border-radius:16px;border:2px solid var(--navy);padding:18px;font:700 19px/1.35 var(--fd);color:var(--navy);text-wrap:balance}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px;font-weight:700;text-align:left;min-height:64px}
.opt small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.opt.sel{border-color:var(--navy);background:var(--navy);color:#fff}
.opt.sel small{color:#c9d4e8}
.done{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:30px 10px}
.done .ck{width:96px;height:96px;border-radius:50%;background:var(--ok);color:#fff;display:flex;align-items:center;justify-content:center;font-size:56px;font-weight:800}
.search{width:100%;border:2px solid var(--line);border-radius:14px;padding:14px;font-size:17px;background:#fff}
.prow{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;width:100%}
.prow b{display:block}
.prow small{color:var(--muted);font-size:12px}
.prow .n{font:800 18px var(--fd);color:var(--navy);white-space:nowrap;font-variant-numeric:tabular-nums}
.stock{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.wh{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px;text-align:left;display:flex;flex-direction:column}
.wh span{font-size:13px;color:var(--muted);font-weight:600}
.wh b{font:800 24px var(--fd);font-variant-numeric:tabular-nums}
.wh.z b{color:#b3bdcb}
.wh.sel{border-color:var(--navy);background:var(--navy);color:#fff}
.wh.sel span{color:#c9d4e8}
.wh[disabled]{opacity:.4}
.txt{width:100%;border:2px solid var(--line);border-radius:14px;padding:14px;font-size:17px;background:#fff}
.tabs{display:flex;gap:6px;overflow-x:auto}
.tabs button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;white-space:nowrap}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.mv{background:#fff;border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.mv.s{border-left-color:var(--ok)} .mv.x{opacity:.5;border-left-color:var(--bad)}
.mv .r1{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.mv .mt{color:var(--muted);font-size:12px}
.pill{border-radius:999px;padding:2px 8px;font-size:11px;font-weight:700;white-space:nowrap}
.p-w{background:var(--warnbg);color:var(--warn)} .p-o{background:var(--okbg);color:var(--ok)} .p-b{background:var(--badbg);color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums;background:#fff;border-radius:12px;overflow:hidden}
td,th{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:11px;color:var(--muted);text-transform:uppercase}
.res-ok{color:var(--ok);font-weight:700} .res-bad{color:var(--bad);font-weight:700} .res-w{color:var(--warn);font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:var(--navy);color:#fff;padding:12px 14px;border-radius:12px;display:flex;gap:12px;align-items:center;z-index:30;width:calc(100% - 32px);max-width:520px;font-weight:600}
.toast button{background:var(--gold);color:var(--navy);border:0;border-radius:8px;padding:8px 12px;font-weight:800}
.demo{background:var(--warnbg);color:var(--warn);font-size:12px;padding:6px 16px;font-weight:600}
.hidden{display:none}
</style>
</head>
<body>
<div class="app">
  <header><div class="brand"><b>KONIDAS</b><small>★ EURONICS</small></div><div class="ht">Αποθήκη</div><button class="who" id="who" data-a="whoami"></button></header>
  <div class="demo">ΔΟΚΙΜΗ με παράδειγμα προϊόντων · δεν αγγίζει το site</div>
  <main id="main"></main>
</div>
<input type="file" id="photo" accept="image/*" capture="environment" class="hidden"><input type="file" id="label" accept="image/*" capture="environment" class="hidden">
<script>
(function(){
"use strict";
var WH=[["KTIMA","Κτήμα"],["MAGAZI","Αποθ. μαγαζιού"],["EKTHESI","Έκθεση"],["AITOLIKI","Αιτωλική"],["NEKTARIOS","Νεκτάριος"],["FYLAXI","Φύλαξη","στον προμηθευτή"],["PARAGGELIA","Παραγγελία","πουλημένα"]];
var NAMES={SUP:"Προμηθευτής",CUS:"Πελάτης",ADJ:"Διόρθωση"};WH.forEach(function(w){NAMES[w[0]]=w[1]});

 P:[{id:"p1",n:"Τηλεόραση LG 55″ 4K",m:"ΔΟΚ-TV55",e:"5200000000011"},{id:"p2",n:"Τηλεόραση Thomson 43″",m:"ΔΟΚ-TV43",e:"5200000000028"},{id:"p3",n:"Κλιματιστικό 12.000 BTU",m:"ΔΟΚ-AC12",e:"5200000000035"},{id:"p4",n:"Ψυγειοκαταψύκτης 185 cm",m:"ΔΟΚ-FR185",e:"5200000000042"},{id:"p5",n:"Πλυντήριο ρούχων 9 kg",m:"ΔΟΚ-WM9",e:"5200000000059"},{id:"p6",n:"Κουζίνα κεραμική 60 cm",m:"ΔΟΚ-KZ60",e:"5200000000066"}],
 site:{p1:{MAGAZI:3,EKTHESI:1},p2:{MAGAZI:2},p3:{KTIMA:6},p4:{KTIMA:2,FYLAXI:2},p5:{AITOLIKI:1,PARAGGELIA:1},p6:{NEKTARIOS:2}},
 mv:[{id:"a1",t:n-9*DAY,u:"Γιάννης",ty:"receive",p:"p4",q:2,f:"SUP",to:"FYLAXI",doc:"delt",syn:n-9*DAY},{id:"a2",t:n-2*DAY,u:"Γιάννης",ty:"reserve",p:"p5",q:1,f:"AITOLIKI",to:"PARAGGELIA",cust:"κ. Παπαδοπούλου",syn:n-2*DAY}],
 bk:[],user:null,last:null}}
var S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.P)S=seed();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var V={scr:S.user?"home":"who"}; // view state (not saved)

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function P(id){for(var i=0;i<S.P.length;i++)if(S.P[i].id===id)return S.P[i]}
function byEan(c){for(var i=0;i<S.P.length;i++){var x=S.P[i];if(x.e===c||(x.x||[]).indexOf(c)>-1)return x}}
function pend(){return S.mv.filter(function(m){return!m.syn&&!m.x&&m.p})}
function sq(p,w){return(S.site[p]&&S.site[p][w])||0}
function lq(p,w){var q=sq(p,w);pend().forEach(function(m){if(m.p!==p)return;if(m.f===w)q-=m.q;if(m.to===w)q+=m.q});return q}
function tot(p){var t=0;WH.forEach(function(w){if(w[0]!=="PARAGGELIA")t+=lq(p,w[0])});return t}
function custOf(p){var r=S.mv.filter(function(m){return m.p===p&&m.ty==="reserve"&&!m.x}).sort(function(a,b){return b.t-a.t})[0];return r&&r.cust}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function hm(t){var d=new Date(t),n=new Date(),s=("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2);return d.toDateString()===n.toDateString()?"σήμερα "+s:d.getDate()+"/"+(d.getMonth()+1)+" "+s}
var IC={
 mv:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg>',
 sale:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16l-1.5 12h-13zM9 7a3 3 0 0 1 6 0"/></svg>',
 cnt:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5h10M9 12h10M9 19h10M4 5l1 1 2-2M4 12l1 1 2-2M4 19l1 1 2-2"/></svg>',
 find:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>'
};

/* ---------- camera ---------- */
var reader=null,lastCode="",lastAt=0,AC=null;
function beep(ok){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),g=AC.createGain();o.frequency.value=ok?1400:300;g.gain.value=.15;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+(ok?.09:.3))}catch(e){}}
function flash(ok){var f=document.getElementById("flash");if(!f)return;f.className="flash "+(ok?"g":"r");setTimeout(function(){f.className="flash"},350)}
function stopCam(){if(reader){try{reader.reset()}catch(e){}reader=null}}
function startCam(){
  var v=document.getElementById("vid");if(!v)return;
  var fail=function(){V.cam="off";stopCam();render()};
  if(typeof ZXing==="undefined"||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){fail();return}
  var h=new Map();var BF=ZXing.BarcodeFormat;h.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[BF.EAN_13,BF.EAN_8,BF.UPC_A,BF.UPC_E,BF.CODE_128,BF.CODE_39,BF.CODE_93,BF.ITF,BF.CODABAR,BF.QR_CODE,BF.DATA_MATRIX,BF.PDF_417]);

function hit(code,f){var now=Date.now();if(code===lastCode&&now-lastAt<3000)return;lastCode=code;lastAt=now;V.onScan&&V.onScan(code,f)}
var photo=document.getElementById("photo");
photo.addEventListener("change",function(){var f=photo.files&&photo.files[0];photo.value="";if(!f)return;
  if(typeof ZXing==="undefined"){say("Η ανάγνωση δεν φόρτωσε. Γράψε τον κωδικό.");return}
  var img=new Image(),u=URL.createObjectURL(f);img.onload=function(){var s=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=img.width*s;c.height=img.height*s;c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);
    var h=new Map();h.set(ZXing.DecodeHintType.TRY_HARDER,true);new ZXing.BrowserMultiFormatReader(h).decodeFromImageUrl(c.toDataURL("image/jpeg",.9)).then(function(r){lastCode="";V.onScan&&V.onScan(r.getText(),fmtName(r))}).catch(function(){say("Δεν διαβάστηκε. Πιο κοντά και με φως.")})};img.src=u});
var labelIn=document.getElementById("label");
labelIn.addEventListener("change",function(){var f=labelIn.files&&labelIn.files[0];labelIn.value="";if(!f)return;var img=new Image(),u=URL.createObjectURL(f);img.onload=function(){var s=Math.min(1,700/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=img.width*s;c.height=img.height*s;c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);
  V.cart.unshift({nw:1,code:V.unknown,fmt:V.ufmt,img:c.toDataURL("image/jpeg",.6),q:1});beep(true);V.msg=["ok","✓ Νέα συσκευή καταγράφηκε. Θα ελεγχθεί πριν μπει στο site."];V.scr="scan";lastScr=null;render()};img.src=u});
function camBlock(){
  if(V.cam==="off")return '<div class="camoff"><b>Η κάμερα δεν άνοιξε. Επέτρεψε την κάμερα στο Safari ή δοκίμασε:</b><button class="btn btn-navy" data-a="photo">Φωτογραφία του barcode</button><button class="btn btn-ghost" data-a="manual">Γράψε κωδικό ή μοντέλο</button></div>';

/* ---------- screens ---------- */
var main=document.getElementById("main");
var lastScr=null;

  if(V.scr===lastScr&&DYN[V.scr]&&reader&&document.getElementById("dyn")){document.getElementById("dyn").innerHTML=DYN[V.scr]();return}

var SCR={};

  '<button class="bigbtn" data-a="startmove">'+IC.mv+'<div><b>Μετακίνηση</b><span>φόρτωση, παραλαβή, παράδοση</span></div></button>'+

    if(V.to==="CUS"){var r=Math.min(left,lq(c.p,"PARAGGELIA"));if(r>0){S.mv.push({id:uid(),b:b,t:t,u:S.user,ty:"deliver",p:c.p,q:r,f:"PARAGGELIA",to:"CUS",note:"από "+NAMES[V.from],cust:custOf(c.p)});left-=r}}
    if(left>0){var m={id:uid(),b:b,t:t,u:S.user,ty:V.from==="SUP"?"receive":V.to==="CUS"?"deliver":"move",p:c.p,q:left,f:V.from,to:V.to};if(V.from==="SUP")m.doc=V.doc;S.mv.push(m)}
    n+=c.q});
  S.last=[V.from,V.to];V.lastBatch=b;save();
  V.doneTxt=n+(n===1?" συσκευή":" συσκευές")+" · "+NAMES[V.from]+" → "+NAMES[V.to];go("done");
}
document.addEventListener("input",function(e){var k=e.target.getAttribute("data-in");if(!k)return;V[k]=e.target.value;if(k==="q"){var pos=e.target.selectionStart;render();var el=document.getElementById("auto");if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(x){}}}});
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-a]");if(!el||el.disabled)return;var a=el.getAttribute("data-a"),v=el.getAttribute("data-v"),i=+el.getAttribute("data-i");
  switch(a){
  case "go":V.q="";go(v);break;
  case "whoami":if(S.user)go("who");break;
  case "setuser":S.user=v;save();go("home");break;
  case "startmove":go("from");break;
  case "lastroute":startScan(S.last[0],S.last[1]);break;
  case "pickfrom":V.from=v;go("to");break;
  case "pickto":startScan(V.from,v);break;
  case "cq":var c=V.cart[i];if(!c)break;if(+v>0&&V.scr==="scan"&&!c.nw){var ok=checkAvail(c.p,c.q+1);if(!ok.ok){V.msg=["bad",ok.why];render();break}}c.q=Math.max(1,c.q+(+v));V.msg=null;render();break;
  case "crm":V.cart.splice(i,1);V.msg=null;render();break;
  case "tosum":go("sum");break;
  case "newdev":V.flagged=0;labelIn.click();break;
  case "backscan":V.flagged=0;V.q="";V.scr=V.cw&&V.onScan===countHit?"countscan":"scan";V.msg=null;render();break;
  case "cancelflow":V.cart=[];V.cw=null;go("home");break;
  case "photo":photo.click();break;
  case "manual":V.q="";go("manual");break;
  case "usecode":var cd=(V.q||"").trim();V.scr=V.cw&&V.onScan===countHit?"countscan":"scan";lastCode="";V.onScan(cd,"χειροκίνητα");break;
  case "manualpick":var p=P(v);V.scr=V.cw&&V.onScan===countHit?"countscan":"scan";lastCode="";V.onScan(p.e);if(V.scr!=="unknown")render();break;
  case "link":var pp=P(v);pp.x=pp.x||[];pp.x.push(V.unknown);V.flagged=0;save();V.scr=V.cw&&V.onScan===countHit?"countscan":"scan";lastCode="";V.onScan(pp.e);break;
  case "doc":V.doc=v;V.msg=null;render();break;
  case "commit":commitCart();break;
  case "undobatch":S.mv=S.mv.filter(function(m){return !(m.b===V.lastBatch&&!m.syn)});save();say("Αναιρέθηκε. Τίποτα δεν άλλαξε.");go("home");break;
  case "startsale":V.q="";V.sp=null;V.sf=null;V.cust="";go("sale");break;
  case "salepick":V.sp=v;V.sf=null;go("sale2");break;
  case "sf":V.sf=v;V.msg=null;render();break;
  case "salecommit":if(!V.sf){V.msg=["bad","Διάλεξε από ποια αποθήκη."];render();break}if(!(V.cust||"").trim()){V.msg=["bad","Γράψε τον πελάτη."];render();break}
    S.mv.push({id:uid(),b:uid(),t:Date.now(),u:S.user,ty:"reserve",p:V.sp,q:1,f:V.sf,to:"PARAGGELIA",cust:V.cust.trim()});save();V.lastBatch=S.mv[S.mv.length-1].b;V.doneTxt=P(V.sp).n+" · κράτηση για "+V.cust.trim();go("done");break;
  case "startcount":V.cw=null;go("count");break;
  case "countwh":V.cw=v;V.cart=[];V.cam=null;lastCode="";V.onScan=countHit;go("countscan");break;
  case "countend":go("countres");break;
  case "countfix":var t=Date.now(),bb=uid();S.P.forEach(function(p){var sys=lq(p.id,V.cw),c=V.cart.filter(function(x){return x.p===p.id})[0],n=c?c.q:0,d=n-sys;if(d)S.mv.push({id:uid(),b:bb,t:t,u:S.user,ty:"count",p:p.id,q:Math.abs(d),f:d<0?V.cw:"ADJ",to:d<0?"ADJ":V.cw})});save();V.lastBatch=bb;V.doneTxt="Το απόθεμα στο "+NAMES[V.cw]+" διορθώθηκε";V.cw=null;go("done");break;
  case "countsend":say("Στάλθηκε στον Γιάννη (στην κανονική έκδοση).");V.cw=null;go("home");break;
  case "startfind":V.q="";go("find");break;
  case "findpick":V.fp=v;go("prod");break;
  case "at":V.at=v;V.msg=null;render();break;
  case "mx":S.mv.forEach(function(m){if(m.id===v)m.x=Date.now()});save();render();break;
  case "minv":S.mv.forEach(function(m){if(m.id===v)m.doc="inv"});save();render();break;
  case "sync":var ids=pend().map(function(m){return m.id}),bk=JSON.parse(JSON.stringify(S.site)),nw={};S.P.forEach(function(p){nw[p.id]={};WH.forEach(function(w){var q=lq(p.id,w[0]);if(q)nw[p.id][w[0]]=q})});S.site=nw;var now=Date.now();S.mv.forEach(function(m){if(ids.indexOf(m.id)>-1)m.syn=now});S.bk.push({site:bk,ids:ids});if(S.bk.length>10)S.bk.shift();save();V.msg=["ok","✓ Πέρασαν "+ids.length+" κινήσεις. Έλεγχος: όλα συμφωνούν. Κρατήθηκε backup."];render();break;
  case "unsync":var l=S.bk.pop();if(l){S.site=l.site;S.mv.forEach(function(m){if(l.ids.indexOf(m.id)>-1)delete m.syn});save();V.msg=["ok","Το site γύρισε όπως ήταν."];render()}break;
  case "mknew":var mm=S.mv.filter(function(m){return m.id===v})[0],nmv=(V["nn_"+v]||"").trim();if(!nmv){say("Γράψε όνομα προϊόντος.");break}var np={id:"n"+uid(),n:nmv,m:"ΝΕΟ",e:mm.code};S.P.push(np);mm.p=np.id;delete mm.nw;save();say("Δημιουργήθηκε. Η παραλαβή μπήκε για πέρασμα στο site.");render();break;
  case "linkold":V.linkm=v;V.q="";go("linkpick");break;
  case "linkdo":var lm=S.mv.filter(function(m){return m.id===V.linkm})[0],lp=P(v);lp.x=lp.x||[];lp.x.push(lm.code);lm.p=lp.id;delete lm.nw;save();V.at="new";say("Συνδέθηκε με "+lp.n);go("admin");break;
  case "unkx":S.unk.splice(i,1);save();render();break;
  case "reset":var u=S.user;S=seed();S.user=u;save();say("Η δοκιμή ξεκίνησε από την αρχή");go("home");break;
  }
});
function countHit(code,fmt){var p=byEan(code);if(!p){beep(false);flash(false);V.unknown=code;V.ufmt=fmt||"";go("unknown");return}
  beep(true);flash(true);var c=V.cart.filter(function(x){return x.p===p.id})[0];if(c)c.q++;else V.cart.unshift({p:p.id,q:1});V.msg=["ok","✓ "+p.n];V.scr="countscan";render()}
render();
})();
</script>
